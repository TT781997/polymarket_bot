Implementa um sistema híbrido de Martingale Condicional e Recuperação Suave (10 rondas) com as seguintes regras:
- Martingale: Se PnL < 0, dobra o multiplicador (x2, x4, x8); se PnL == 0.0, mantém o multiplicador atual; se PnL > 0 (green), reseta o multiplicador para x1.
- Recuperação: Soma perdas ao accumulated_loss e adiciona +10 rondas ao prazo por cada perda. Se houver lucro, abate no prejuízo e reduz 1 ronda. A parcela de recuperação no trade é o prejuízo dividido pelas rondas restantes.
- Segurança: O Risco Efetivo total (Risco Base * Martingale) + (Accumulated Loss / Rondas) nunca pode ultrapassar um limite rígido de 15% da banca atual.

