O bot calculou o PEG de 0.97 usando os preços base (42.0c + 55.0c). Mas não foi a esses preços que a compra foi executada.
Preço Ask (Spread): Para conseguir comprar, o bot teve de pagar o preço "Ask", que foi mais alto: 43.0c (UP) + 56.0c (DOWN) = 99.0c.
Preço Efetivo (Comissões/Fees): Após aplicar as comissões de ~1.50%, o custo efetivo por share subiu ainda mais: 43.7c (UP) + 56.9c (DOWN) = 100.6c.
Ou seja o PEG tem que ser calculado segundo o Preço Efectivo e tem que ser Menor que 1.
Calcular o PEG baseado no Eff (Effective Price) e não no preço base. Só deve entrar se (Eff_UP + Eff_DOWN) < 1.00.
Calcular o tamanho da posição por Shares e não por $. O bot deve comprar, por exemplo, 100 shares de UP e 100 shares de DOWN, calculando o capital necessário para cada lado, em vez de injetar $ de ambos os lados. A base é continua a ser 20% da banca. Caso compres x numero de shares com 20% da banca em UP, tens que comprar o mesmo numero de shares em DOWN independentemente da percentagem da banca

